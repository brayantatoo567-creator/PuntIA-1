name: PuntIA Constructor CI

on:
  push:
    branches: [feature/puntia-commercial-landing]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  constructor:
    name: Probar constructor gratuito
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Validar motor y pruebas del proyecto
        run: npm test
      - name: Validar sintaxis del motor y del script HTML
        run: |
          node --check public/pattern-builder.js
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('public/constructor.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\\s\\S]*?)<\\/script>/gi)];
          if (scripts.length !== 1) throw new Error('Se esperaba un único script inline en el constructor');
          if (!html.includes('<script src="/pattern-builder.js"></script>')) throw new Error('Falta cargar el motor del constructor');
          fs.writeFileSync('/tmp/puntia-constructor.js', scripts[0][1]);
          NODE
          node --check /tmp/puntia-constructor.js
      - name: Comprobar integridad básica del constructor
        run: |
          grep -q 'Vuelta ' public/pattern-builder.js
          grep -q 'PuntiaPatternBuilder.makePattern' public/constructor.html
          ! grep -q 'const safeName=.*const safeName=' public/constructor.html
