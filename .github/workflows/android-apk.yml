name: Tejilume Android APK

on:
  workflow_dispatch:
  push:
    branches: [release/mvp-beta-2026-11, audit/general-audit-2026-10]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate API URL configuration
        env:
          PUNTIA_API_BASE_URL: ${{ vars.PUNTIA_API_BASE_URL || 'https://puntia-beta.onrender.com' }}
        run: |
          if [ -z "$PUNTIA_API_BASE_URL" ]; then
            echo "::error::La URL HTTPS del backend PuntIA no está configurada."
            exit 1
          fi
          node -e "const u=new URL(process.env.PUNTIA_API_BASE_URL); if(u.protocol!=='https:' || u.username || u.password) process.exit(1)"

      - name: Install Capacitor tooling
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7

      - name: Prepare web assets
        env:
          PUNTIA_API_BASE_URL: ${{ vars.PUNTIA_API_BASE_URL || 'https://puntia-beta.onrender.com' }}
        run: |
          rm -rf www
          cp -R public www
          node -e "const fs=require('fs');const base=process.env.PUNTIA_API_BASE_URL.replace(/\/$/,'');fs.writeFileSync('www/config.js','window.PUNTIA_API_BASE_URL = '+JSON.stringify(base)+';\\n')"
          test -s www/index.html
          test -s www/config.js
          grep -q 'async function api(path,options)' www/index.html
          grep -q 'serviceWorker.register' www/index.html

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
          # Android 10 (API 29) and newer: pin Capacitor's minimum SDK explicitly.
          grep -q 'minSdkVersion' android/variables.gradle
          sed -i 's/minSdkVersion = .*/minSdkVersion = 23/' android/variables.gradle
          grep -q 'minSdkVersion = 23' android/variables.gradle

      - name: Build debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tejilume-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
