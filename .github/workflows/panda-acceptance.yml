name: Panda Hamburguesero acceptance tests

on:
  push:
    branches: [main, "qa/**"]
    paths:
      - "panda-pattern-audit.cjs"
      - "tests/panda-acceptance.test.cjs"
      - "tests/fixtures/panda-hamburguesero.case.json"
      - ".github/workflows/panda-acceptance.yml"
  pull_request:
    paths:
      - "panda-pattern-audit.cjs"
      - "tests/panda-acceptance.test.cjs"
      - "tests/fixtures/panda-hamburguesero.case.json"
      - ".github/workflows/panda-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  panda-pattern-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Panda Hamburguesero acceptance suite
        run: npm run test:panda
