name: PuntIA Live AI Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/puntia-live-smoke.yml'
      - 'server.js'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-ai-smoke:
    if: ${{ vars.PUNTIA_API_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Wait for configured live health endpoint
        shell: bash
        env:
          PUNTIA_API_BASE_URL: ${{ vars.PUNTIA_API_BASE_URL }}
        run: |
          set -euo pipefail
          URL="${PUNTIA_API_BASE_URL%/}"
          for attempt in $(seq 1 24); do
            if curl -fsS --max-time 10 "$URL/api/health" -o /tmp/health.json; then
              node -e 'const h=require("/tmp/health.json"); if(!h.ok || !h.ai) process.exit(1); console.log("Health and AI OK:",h.model)'
              exit 0
            fi
            echo "Health endpoint not ready (attempt $attempt/24)"
            sleep 5
          done
          echo "Health endpoint did not become ready: $URL"
          exit 1
      - name: Test real AI chat
        env:
          PUNTIA_API_BASE_URL: ${{ vars.PUNTIA_API_BASE_URL }}
        run: |
          set -euo pipefail
          URL="${PUNTIA_API_BASE_URL%/}"
          CODE=$(curl -sS --max-time 150 -o /tmp/chat.json -w '%{http_code}' -H 'Content-Type: application/json' -X POST "$URL/api/puntia/chat" --data '{"message":"Responde en español en una frase breve: ¿qué es un punto bajo en crochet?"}')
          test "$CODE" = "200"
          node -e 'const r=require("/tmp/chat.json"); if(typeof r.reply!=="string" || r.reply.trim().length<10) throw Error("Chat response empty"); console.log("PASS: live chat",r.reply.length,"characters")'
      - name: Generate a real amigurumi pattern
        env:
          PUNTIA_API_BASE_URL: ${{ vars.PUNTIA_API_BASE_URL }}
        run: |
          set -euo pipefail
          URL="${PUNTIA_API_BASE_URL%/}"
          CODE=$(curl -sS --max-time 150 -o /tmp/pattern.json -w '%{http_code}' -H 'Content-Type: application/json' -X POST "$URL/api/puntia/generate-pattern" --data '{"name":"conejito amigurumi de prueba","level":"Principiante","height":"12 cm","style":"simple y tierno"}')
          if [ "$CODE" != "200" ]; then cat /tmp/pattern.json; exit 1; fi
          node -e 'const p=String(require("/tmp/pattern.json").pattern||""); if(p.length<80 || !/material/i.test(p) || !/ronda|vuelta/i.test(p)) process.exit(1); console.log("PASS: pattern structure")'
      - name: Test real image diagnosis
        env:
          PUNTIA_API_BASE_URL: ${{ vars.PUNTIA_API_BASE_URL }}
        run: |
          set -euo pipefail
          URL="${PUNTIA_API_BASE_URL%/}"
          python3 <<'PY'
          import struct,zlib
          w=h=128
          rows=[]
          for y in range(h):
            row=bytearray([0])
            for x in range(w):
              loop=((x-64)**2+(y-64)**2)%625<110
              row.extend((110,76,55) if loop else (235,220,200))
            rows.append(bytes(row))
          def chunk(k,d): return struct.pack(">I",len(d))+k+d+struct.pack(">I",zlib.crc32(k+d)&0xffffffff)
          png=b"\x89PNG\r\n\x1a\n"+chunk(b"IHDR",struct.pack(">IIBBBBB",w,h,8,2,0,0,0))+chunk(b"IDAT",zlib.compress(b"".join(rows)))+chunk(b"IEND",b"")
          open("/tmp/test.png","wb").write(png)
          PY
          CODE=$(curl -sS --max-time 150 -o /tmp/diagnose.json -w '%{http_code}' -X POST "$URL/api/puntia/diagnose" -F 'image=@/tmp/test.png;type=image/png')
          if [ "$CODE" != "200" ]; then cat /tmp/diagnose.json; exit 1; fi
          node -e 'const a=String(require("/tmp/diagnose.json").analysis||""); if(a.length<10) process.exit(1); console.log("PASS: image diagnosis",a.length,"characters")'
  live-smoke-not-configured:
    if: ${{ vars.PUNTIA_API_BASE_URL == '' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Live AI tests skipped. Configure repository variable PUNTIA_API_BASE_URL with the real HTTPS backend URL."
