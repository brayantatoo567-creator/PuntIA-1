name: PuntIA Live AI Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/puntia-live-smoke.yml'
      - 'server.js'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-ai-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Wait for live health endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL="https://puntia-validation-production.up.railway.app"
          for attempt in $(seq 1 24); do
            if curl -fsS --max-time 10 "$URL/api/health" -o /tmp/health.json; then
              cat /tmp/health.json
              node -e 'const h=require("/tmp/health.json"); if(!h.ok) process.exit(1); if(!h.ai) { console.error("AI is not configured on the live service"); process.exit(2); } console.log("Health OK; AI configured; model:", h.model);'
              exit 0
            fi
            echo "Health endpoint not ready (attempt $attempt/24)"
            sleep 5
          done
          echo "Health endpoint did not become ready"
          exit 1

      - name: Test real AI chat
        shell: bash
        run: |
          set -euo pipefail
          URL="https://puntia-validation-production.up.railway.app"
          CODE=$(curl -sS --max-time 150 -o /tmp/chat.json -w '%{http_code}' -H 'Content-Type: application/json' -X POST "$URL/api/puntia/chat" --data '{"message":"Responde en español en una frase breve: ¿qué es un punto bajo en crochet?"}')
          echo "Chat API HTTP status: $CODE"
          test "$CODE" = "200"
          node -e 'const r=require("/tmp/chat.json"); if(typeof r.reply!=="string" || r.reply.trim().length<10) throw Error("Chat response empty or too short"); console.log("PASS: live AI chat response:",r.reply.length,"characters; emotion:",r.emotion||"not returned")'

      - name: Generate a real amigurumi pattern
        shell: bash
        run: |
          set -euo pipefail
          URL="https://puntia-validation-production.up.railway.app"
          CODE=$(curl -sS --max-time 150 -o /tmp/pattern.json -w '%{http_code}' -H 'Content-Type: application/json' -X POST "$URL/api/puntia/generate-pattern" --data '{"name":"conejito amigurumi de prueba","level":"Principiante","height":"12 cm","style":"simple y tierno"}')
          echo "Pattern API HTTP status: $CODE"
          if [ "$CODE" != "200" ]; then node -e 'try { console.error(require("/tmp/pattern.json").error || "No error detail") } catch {}'; exit 1; fi
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/pattern.json','utf8'));
          const p=String(d.pattern||'').trim();
          const checks={
            nonEmpty:p.length>80,
            materials:/material/i.test(p),
            roundsOrRows:/ronda|vuelta/i.test(p),
            assemblyOrPieces:/ensambl|unir|pieza|oreja|cuerpo/i.test(p),
            counts:/\(\s*\d+\s*(?:puntos?|pts?)?\s*\)/i.test(p)||/\d+\s*(?:puntos?|pts?)\s*(?:en total|totales)/i.test(p)
          };
          console.log('Pattern length:',p.length,'checks:',JSON.stringify(checks));
          if(!checks.nonEmpty||!checks.materials||!checks.roundsOrRows||!checks.assemblyOrPieces||!checks.counts) process.exit(1);
          console.log('PASS: live pattern response has required structure.');
          NODE

      - name: Test real image diagnosis
        shell: bash
        run: |
          set -euo pipefail
          URL="https://puntia-validation-production.up.railway.app"
          # Small valid PNG fixture; this checks upload handling and the live vision-model path.
          node -e 'require("fs").writeFileSync("/tmp/test.png",Buffer.from("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+j4WQAAAAASUVORK5CYII=","base64"))'
          CODE=$(curl -sS --max-time 150 -o /tmp/diagnose.json -w '%{http_code}' -X POST "$URL/api/puntia/diagnose" -F 'image=@/tmp/test.png;type=image/png')
          echo "Image diagnosis HTTP status: $CODE"
          if [ "$CODE" != "200" ]; then node -e 'try { console.error(require("/tmp/diagnose.json").error || "No error detail") } catch {}'; exit 1; fi
          node -e 'const r=require("/tmp/diagnose.json"); if(typeof r.analysis!=="string" || r.analysis.trim().length<10) throw Error("Vision response empty or too short"); console.log("PASS: live image diagnosis returned",r.analysis.length,"characters.")'
