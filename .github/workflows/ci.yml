name: PuntIA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Verificar API de PuntIA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar archivos de aplicación
        run: |
          test -f package.json
          test -f server.js
          test -f index.html
          test -f public/index.html
          cmp -s index.html public/index.html || { echo 'index.html and public/index.html must stay synchronized'; exit 1; }
          grep -q 'OPENAI_TIMEOUT_MS=45000' .env.example
          grep -q '/data/puntia-memory.json' .gitignore
          test -f public/puntia-mascota.svg
          test -f public/puntia-mascota-original.webp.b64
          grep -q 'src="/puntia-mascota.svg"' public/index.html
          grep -q '<link rel="icon" type="image/svg+xml" href="/puntia-mascota.svg">' public/index.html
          grep -q 'loadPuntiaOriginalMascot' public/index.html
          grep -q 'reference-mascot' public/index.html
          grep -q 'const escapeHtml=' public/index.html
          grep -q 'formatAssistantText(j.pattern' public/index.html
          grep -q 'formatAssistantText(j.analysis' public/index.html
          grep -q 'escapeHtml(p\[0\])' public/index.html
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const required = [
            "$$('.lesson-jump-btn').forEach",
            "const oldSvgs=$$('.lesson-art .stitch-visual')",
            "$$('[data-action=",
            "$$('#drawerNav button').forEach"
          ];
          for (const selector of required) {
            if (!html.includes(selector)) throw new Error('Falta selector de colección: ' + selector);
          }
          const invalid = [
            "function renderLesson(){const l=crochetLessons[lessonIndex];$('.lesson-jump-btn').forEach",
            "const oldSvgs=$('.lesson-art .stitch-visual')",
            ";$('[data-action=",
            ";$('#drawerNav button').forEach"
          ];
          for (const selector of invalid) {
            if (html.includes(selector)) throw new Error('Selector de elemento único usado como colección: ' + selector);
          }
          const encoded = fs.readFileSync('public/puntia-mascota-original.webp.b64', 'utf8').trim();
          if (!encoded || !/^[A-Za-z0-9+/]+={0,2}$/.test(encoded)) throw new Error('El recurso de la mascota no es base64 válido');
          const image = Buffer.from(encoded, 'base64');
          if (image.length < 1000 || image.toString('ascii', 0, 4) !== 'RIFF' || image.toString('ascii', 8, 12) !== 'WEBP') {
            throw new Error('El recurso decodificado no tiene una firma WebP válida');
          }
          console.log('Mascota WebP validada:', image.length, 'bytes');
          NODE
          node -e "const p=require('./package.json'); if(!p.dependencies?.express || !p.dependencies?.openai || !p.dependencies?.multer) process.exit(1)"

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Comprobar sintaxis del backend y frontend
        run: |
          node --check server.js
          node -e "const fs=require('fs');const html=fs.readFileSync('public/index.html','utf8');const m=html.match(/<script>([\\s\\S]*?)<\\/script>/);if(!m)throw Error('No se encontró el script de la interfaz');fs.writeFileSync('/tmp/puntia-ui.js',m[1])"
          node --check /tmp/puntia-ui.js

      - name: Instalar Chromium para pruebas de interfaz
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install chromium

      - name: Pruebas de interfaz en escritorio y móvil
        run: node tests/ui-smoke.cjs

      - name: Guardar capturas de la interfaz
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puntia-ui-smoke-screenshots
          path: test-artifacts/
          if-no-files-found: ignore

      - name: Probar endpoints y validaciones
        shell: bash
        run: |
          set -euo pipefail
          PORT=8080 node server.js > /tmp/puntia.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/api/health > /tmp/health.json; then READY=1; break; fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then cat /tmp/puntia.log; exit 1; fi

          STATUS=$(curl -s -o /tmp/home.html -w '%{http_code}' http://127.0.0.1:8080/)
          test "$STATUS" = "200"
          grep -q 'PuntIA' /tmp/home.html

          STATUS=$(curl -s -o /tmp/mascot.svg -w '%{http_code}' http://127.0.0.1:8080/puntia-mascota.svg)
          test "$STATUS" = "200"
          grep -q '<svg' /tmp/mascot.svg

          STATUS=$(curl -s -o /tmp/mascot-webp-b64.txt -w '%{http_code}' http://127.0.0.1:8080/puntia-mascota-original.webp.b64)
          test "$STATUS" = "200"
          cmp public/puntia-mascota-original.webp.b64 /tmp/mascot-webp-b64.txt

          node -e "const h=require('/tmp/health.json'); if(h.ok!==true) process.exit(1); if(typeof h.ai!=='boolean') process.exit(1); console.log('Health endpoint schema OK; AI key configured:',h.ai)"

          STATUS=$(curl -s -o /tmp/chat-empty.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"message":"   "}' http://127.0.0.1:8080/api/puntia/chat)
          test "$STATUS" = "400"

          STATUS=$(curl -s -o /tmp/chat-unconfigured.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"message":"Ayúdame con un patrón de crochet"}' http://127.0.0.1:8080/api/puntia/chat)
          test "$STATUS" = "503"
          node -e "const e=require('/tmp/chat-unconfigured.json'); if(!e.error || !e.error.includes('no está configurada')) process.exit(1)"

          STATUS=$(curl -s -o /tmp/pattern-unconfigured.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"name":"conejo"}' http://127.0.0.1:8080/api/puntia/generate-pattern)
          test "$STATUS" = "503"

          STATUS=$(curl -s -o /tmp/diagnose-empty.json -w '%{http_code}' -X POST http://127.0.0.1:8080/api/puntia/diagnose)
          test "$STATUS" = "400"

          # Anonymous memory must be isolated by a high-entropy session ID.
          STATUS=$(curl -s -o /tmp/memory-shared.json -w '%{http_code}' http://127.0.0.1:8080/api/puntia/memory/demo-user)
          test "$STATUS" = "404"
          STATUS=$(curl -s -o /tmp/memory-no-session.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"content":"must not be stored"}' http://127.0.0.1:8080/api/puntia/memory)
          test "$STATUS" = "400"
          SESSION_ID=0123456789abcdef0123456789abcdef
          STATUS=$(curl -s -o /tmp/memory-save.json -w '%{http_code}' -H 'Content-Type: application/json' -d "{\"userId\":\"$SESSION_ID\",\"content\":\"memory isolation test\"}" http://127.0.0.1:8080/api/puntia/memory)
          test "$STATUS" = "200"
          STATUS=$(curl -s -o /tmp/memory-read.json -w '%{http_code}' "http://127.0.0.1:8080/api/puntia/memory/$SESSION_ID")
          test "$STATUS" = "200"
          node -e "const m=require('/tmp/memory-read.json'); if(!m.items?.some(x=>x.content==='memory isolation test')) process.exit(1)"
          STATUS=$(curl -s -o /tmp/memory-delete.json -w '%{http_code}' -X DELETE "http://127.0.0.1:8080/api/puntia/memory/$SESSION_ID")
          test "$STATUS" = "200"

          STATUS=$(curl -s -o /tmp/chat-long.json -w '%{http_code}' -H 'Content-Type: application/json' --data-binary "$(node -e 'process.stdout.write(JSON.stringify({message: "x".repeat(8001)}))')" http://127.0.0.1:8080/api/puntia/chat)
          test "$STATUS" = "413"

          STATUS=$(curl -s -o /tmp/diagnose-invalid-type.json -w '%{http_code}' -F 'image=@.github/workflows/ci.yml;type=text/plain' http://127.0.0.1:8080/api/puntia/diagnose)
          test "$STATUS" = "415"

          echo "Health and negative-path API checks passed."
 .env.example
          grep -q '^/data/puntia-memory.json          test -f public/puntia-mascota.svg
          test -f public/puntia-mascota-original.webp.b64
          grep -q 'src="/puntia-mascota.svg"' public/index.html
