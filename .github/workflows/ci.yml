name: Tejilume CI

on:
  push:
    branches: [main, audit/general-audit-2026-10, release/mvp-beta-2026-11]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Verificar aplicación y API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar archivos y estructura
        run: |
          set -e
          test -f package.json
          test -f server.js
          test -f public/index.html
          test -f public/service-worker.js
          test -f public/manifest.webmanifest
          test -f pattern-validator.cjs
          test -f admin-panel.cjs
          test -f public/admin.html
          test -f tests/admin-security.cjs
          test -f tests/pattern-math.cjs
          test -f tests/pattern-quality.cjs
          cmp -s index.html public/index.html
          grep -q 'Tejilume' public/index.html
          grep -q 'id="createForm"' public/index.html
          grep -q 'id="adminPanel"' public/index.html
          grep -q 'Abrir panel de administrador' public/index.html
          grep -q 'AES-256-GCM' public/admin.html
          grep -q "call('/key'" public/admin.html
          grep -q 'id="dbState"' public/admin.html
          grep -q 'id="keyState"' public/admin.html
          grep -q 'id="aiState"' public/admin.html
          grep -q 'Guardar y probar' public/admin.html
          grep -q '/setup-status' public/admin.html
          if grep -Eiq 'localStorage|sessionStorage|document\.cookie|testButton' public/admin.html; then echo 'Almacenamiento o lectura de credenciales en navegador detectado'; exit 1; fi
          grep -q 'id="billingSimulator"' public/index.html
          grep -q 'data-plan="premium"' public/index.html
          grep -q '/api/imaginaria/create' public/index.html
          grep -q '/api/imaginaria/step-image' public/index.html
          grep -q 'OPENAI_IMAGE_MODEL=gpt-image-1' .env.example
          node -e "const p=require('./package.json');if(p.name!=='tejilume'||!p.dependencies?.express||!p.dependencies?.openai||!p.dependencies?.multer)process.exit(1)"
          node -e "const m=JSON.parse(require('fs').readFileSync('public/manifest.webmanifest','utf8'));if(m.short_name!=='Tejilume'||m.start_url!=='/'||m.display!=='standalone')process.exit(1)"
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('public/index.html','utf8');
          const start=html.lastIndexOf('<script>')+8;
          const end=html.lastIndexOf('</script>');
          if(start<8||end<=start) throw new Error('No se encontró el script de la aplicación');
          fs.writeFileSync('/tmp/tejilume-ui.js',html.slice(start,end));
          for(const id of ['createForm','createBtn','result','visualGrid','adminPanel']) {
            if(!html.includes('id="'+id+'"')) throw new Error('Falta elemento '+id);
          }
          const admin=fs.readFileSync('public/admin.html','utf8');
          const aStart=admin.lastIndexOf('<script>')+8;
          const aEnd=admin.lastIndexOf('</script>');
          if(aStart<8||aEnd<=aStart) throw new Error('No se encontró el script del panel admin');
          fs.writeFileSync('/tmp/tejilume-admin.js',admin.slice(aStart,aEnd));
          console.log('Estructura de interfaz Tejilume verificada');
          NODE
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Comprobar sintaxis y reglas de crochet
        run: |
          node --check server.js
          node --check admin-panel.cjs
          node --check public/service-worker.js
          node --check public/config.js
          node --check /tmp/tejilume-ui.js
          node --check /tmp/tejilume-admin.js
          npm run check
      - name: Probar API y rutas de creación
        shell: bash
        run: |
          set -euo pipefail
          PORT=8080 node server.js >/tmp/tejilume.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          READY=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/api/health >/tmp/health.json; then READY=1; break; fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then cat /tmp/tejilume.log; exit 1; fi
          curl -fsS http://127.0.0.1:8080/ >/tmp/home.html
          grep -q 'Tejilume' /tmp/home.html
          curl -fsS http://127.0.0.1:8080/admin >/tmp/admin.html
          grep -q 'Entrar al panel' /tmp/admin.html
          STATUS=$(curl -s -o /tmp/admin-status.json -w '%{http_code}' http://127.0.0.1:8080/api/admin/status)
          test "$STATUS" = "401"
          STATUS=$(curl -s -o /tmp/create-empty.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8080/api/imaginaria/create)
          test "$STATUS" = "400"
          STATUS=$(curl -s -o /tmp/create-no-key.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"idea":"un pulpo astronauta"}' http://127.0.0.1:8080/api/imaginaria/create)
          test "$STATUS" = "503"
          STATUS=$(curl -s -o /tmp/image-no-key.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"stage":"cuerpo","step":"tejer el cuerpo","context":"pulpo astronauta"}' http://127.0.0.1:8080/api/imaginaria/step-image)
          test "$STATUS" = "503"
          STATUS=$(curl -s -o /tmp/unknown.json -w '%{http_code}' http://127.0.0.1:8080/api/no-existe)
          test "$STATUS" = "404"
          if grep -q 'X-PuntIA-OpenAI-Key\|tejilume_api_key' public/index.html server.js; then echo 'Clave de navegador aún habilitada'; exit 1; fi
          echo "Rutas, panel privado y respuestas sin credenciales verificadas."

      - name: Comprobar asistente cuando faltan variables de producción
        shell: bash
        run: |
          set -euo pipefail
          env -u DATABASE_URL -u ADMIN_PASSWORD -u SESSION_SECRET -u MASTER_KEY NODE_ENV=production PORT=8081 node server.js >/tmp/tejilume-setup.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          READY=0
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8081/admin >/tmp/setup-admin.html; then READY=1; break; fi
            sleep 1
          done
          test "$READY" = "1"
          grep -q 'Configuración necesaria' /tmp/setup-admin.html
          curl -fsS http://127.0.0.1:8081/api/admin/setup-status >/tmp/setup-status.json
          for variable in DATABASE_URL ADMIN_PASSWORD SESSION_SECRET MASTER_KEY; do grep -q "$variable" /tmp/setup-status.json; done
          echo "El servidor permanece disponible y enumera las variables faltantes sin exponer valores."

      - name: Empaquetar versión consolidada sin secretos
        run: git archive --format=zip --output=tejilume-source.zip HEAD
      - name: Publicar ZIP de código fuente consolidado
        uses: actions/upload-artifact@v4
        with:
          name: TEJILUME-source-consolidated
          path: tejilume-source.zip
          if-no-files-found: error
          retention-days: 14
