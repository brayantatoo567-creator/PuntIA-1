 <linearGradient id="skin" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#ffd9bd"/><stop offset="1" stop-color="#efaa91"/></linearGradient>
 <linearGradient id="dress" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c7a0ff"/><stop offset="1" stop-color="#7852c9"/></linearGradient>
 <linearGradient id="yarn" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb0d8"/><stop offset="1" stop-color="#ed4b9c"/></linearGradient>
 <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#130c2b" flood-opacity=".2"/></filter>
 <pattern id="stitch" width="12" height="10" patternUnits="userSpaceOnUse"><path d="M2 3 Q6 -1 10 3 M2 8 Q6 4 10 8" fill="none" stroke="#fff" stroke-opacity=".24" stroke-width="1.8" stroke-linecap="round"/></pattern>
</defs>
