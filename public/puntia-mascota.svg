<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="title desc">
<title id="title">PuntIA, asistente de crochet</title><desc id="desc">Muñeca amigurumi de cabello rosa, vestido violeta, gancho de crochet y ovillo de estambre.</desc>
<defs>
